services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: habit_db_dev
      POSTGRES_USER: habit_user
      POSTGRES_PASSWORD: habit_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - habit_network

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    networks:
      - habit_network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./backend.env
    volumes:
      - ../../backend:/app
      - logs:/app/logs
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - habit_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend.env
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev
    stdin_open: true
    depends_on:
      - backend
    networks:
      - habit_network

  mail-queue:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: python manage.py send_emails --interval 30
    env_file:
      - ./backend.env
    depends_on:
      - db
      - redis
    networks:
      - habit_network

volumes:
  postgres_data_dev:
  logs:
  media_files:

networks:
  habit_network:
    driver: bridge
